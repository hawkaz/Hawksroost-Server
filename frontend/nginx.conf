# The app's web server. Caddy (HTTPS, from the internet) and LAN visitors
# reach it on port 8080.
# Only the app (its API serves live radio too) and the video player API are
# exposed — never go2rtc's or Icecast's own pages.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 12m;
    server_tokens off;

    # Docker's DNS, so optional services (icecast) can be missing at startup.
    resolver 127.0.0.11 valid=30s ipv6=off;

    include /etc/nginx/hawk-headers.conf;

    # Compress text for people on the cabin network (Caddy compresses for the internet).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json;

    # --- API ------------------------------------------------------------------
    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;          # stream camera clip downloads
        proxy_read_timeout 300s;
    }

    # Session check used to guard live video below. (Live radio comes through the API.)
    location = /_auth {
        internal;
        set $api http://api:8000;
        proxy_pass $api/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
    }

    # --- Live video (go2rtc) — signed-in users only --------------------------------
    # The player script. go2rtc sends it without cache headers; keep it a day so
    # opening a camera doesn't fetch it again over Starlink every time.
    location = /video/video-rtc.js {
        set $g http://go2rtc:1984;
        proxy_pass $g/video-rtc.js;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/hawk-headers.conf;
    }

    # go2rtc only accepts a video websocket whose Origin matches the Host it sees,
    # so pass the browser's host (hawksroost.live or the LAN address) through.
    # Only our own camera streams, by name: go2rtc would otherwise open any URL
    # given in ?src= (any host on the cabin network), so nothing else gets through.
    location = /video/api/ws {
        if ($args !~ "^src=cam[0-9]+_(sub|main|tele)$") { return 403; }
        auth_request /_auth;
        set $g http://go2rtc:1984;
        proxy_pass $g/api/ws$is_args$args;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    # HLS (Safari without MSE): the websocket hands out playlist links by session id.
    location ^~ /video/api/hls/ {
        auth_request /_auth;
        set $g http://go2rtc:1984;
        rewrite ^/video/api/hls/(.*)$ /api/hls/$1 break;
        proxy_pass $g;
        proxy_buffering off;
    }
    location /video/ { return 404; }

    # --- App -------------------------------------------------------------------------
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/hawk-headers.conf;
        try_files $uri =404;
    }
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/hawk-headers.conf;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include /etc/nginx/hawk-headers.conf;
    }
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/hawk-headers.conf;
        try_files $uri /200.html;
    }
}
