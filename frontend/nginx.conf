# The app's web server. Caddy (HTTPS, from the internet) and LAN visitors
# reach it on port 8080.
# Only the app, the video player API and the radio stream are exposed — never
# go2rtc's or Icecast's admin pages.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 12m;
    server_tokens off;

    # Docker's DNS, so optional services (icecast) can be missing at startup.
    resolver 127.0.0.11 valid=30s ipv6=off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # --- API ------------------------------------------------------------------
    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;          # stream camera clip downloads
        proxy_read_timeout 300s;
    }

    # Session check used to guard video and radio below.
    location = /_auth {
        internal;
        set $api http://api:8000;
        proxy_pass $api/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
    }

    # --- Live video (go2rtc) — signed-in users only --------------------------------
    location = /video/video-stream.js { set $g http://go2rtc:1984; proxy_pass $g/video-stream.js; }
    location = /video/video-rtc.js    { set $g http://go2rtc:1984; proxy_pass $g/video-rtc.js; }

    location = /video/api/ws {
        auth_request /_auth;
        set $g http://go2rtc:1984;
        proxy_pass $g/api/ws$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location = /video/api/stream.m3u8 {
        auth_request /_auth;
        set $g http://go2rtc:1984;
        proxy_pass $g/api/stream.m3u8$is_args$args;
    }
    location ^~ /video/api/hls/ {
        auth_request /_auth;
        set $g http://go2rtc:1984;
        rewrite ^/video/api/hls/(.*)$ /api/hls/$1 break;
        proxy_pass $g;
        proxy_buffering off;
    }
    location = /video/api/frame.jpeg {
        auth_request /_auth;
        set $g http://go2rtc:1984;
        proxy_pass $g/api/frame.jpeg$is_args$args;
    }
    location /video/ { return 404; }

    # --- Live radio (Icecast) — signed-in users only ------------------------------
    location ^~ /radio/live/ {
        auth_request /_auth;
        set $ice http://icecast:8000;
        rewrite ^/radio/live/(.*)$ /$1 break;
        proxy_pass $ice;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # --- App -------------------------------------------------------------------------
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /200.html;
    }
}
