###############################################################################
# Hawksroost Server — RTLSDR-Airband configuration
#
# Engine : RTLSDR-Airband  (https://github.com/rtl-airband/RTLSDR-Airband)
# Image  : ghcr.io/rtl-airband/rtlsdr-airband:v5.2.0
#          (its Dockerfile builds the RTL-SDR Blog V4 librtlsdr fork, so your
#           RTL-SDR Blog v4 dongle tunes correctly *inside* the container)
# Syntax : libconfig.  Mounted into the container at /app/rtl_airband.conf
#          ( '#', '//' and '/* */' are all valid comments )
#
# ---------------------------------------------------------------------------
# WHAT IS ACTIVE RIGHT NOW (Step 1):
#   ONE RTL-SDR v4, parked on the NOAA weather window, recording the WXK76
#   continuous carrier (162.400 MHz, Mt. Eldon) to /recordings. This is the
#   end-to-end smoke test: if .mp3 files land in ./recordings on the host,
#   the receive -> demod -> record chain works.
#
#   Everything below the ACTIVE block is COMMENTED OUT — it is your roadmap
#   for real channels and extra dongles. Nothing commented runs.
# ---------------------------------------------------------------------------
#
#  !!!  ONE DONGLE SEES ONLY ~2 MHz AT ONCE  !!!
#   sample_rate = 2.40 Msps  ->  usable window ~= centerfreq +/- 1.0 MHz.
#   e.g. centerfreq 162.5 covers ~161.5 .. 163.5 MHz.
#   Your targets span 155–467 MHz, so a SINGLE dongle CANNOT watch sheriff
#   (~155), NOAA/forestry (162–173) and GMRS (~462) at the same time.
#   => One `devices:` block = ONE physical dongle = ONE ~2 MHz window.
#      Add dongles (commented blocks below) to cover more clusters.
#   Full window math + cluster plan: docs/band-planning.md
###############################################################################

# ---- Global options ---------------------------------------------------------
fft_size = 1024;                 # channelizer FFT bins; 1024 is fine for VHF
localtime = true;                # timestamp filenames in LOCAL time (TZ in .env
                                 # -> America/Phoenix). false = UTC.
multiple_demod_threads = true;
multiple_output_threads = true;

devices:
(
  # ===========================================================================
  # DEVICE 0  —  ACTIVE  —  VHF "weather" window (Step 1 smoke test)
  # The only block that runs right now. Single RTL-SDR v4 parked on NOAA.
  # ===========================================================================
  {
    type = "rtlsdr";

    # --- Which physical dongle? --------------------------------------------
    # With ONE dongle, index 0 always works (no serial to mistype).
    index = 0;
    # When you add a 2nd dongle, switch to SERIAL selection so a USB replug
    # can't swap which dongle is which. Find it with:  rtl_test
    # (factory v4 serial is usually "00000001"; set your own while NOTHING
    #  else holds the dongle:  rtl_eeprom -s hawk-vhf )
    # serial = "00000001";

    gain = 28.0;          # dB (R828D range ~0–49.6). NOAA is strong; if audio
                          # is distorted/overloaded LOWER this, if weak/no
                          # signal RAISE it. The roof GP-6 is off-band at 162
                          # MHz, so you may need more gain than a tuned antenna.
    sample_rate = 2.40;   # Msps. 2.40 is rock-solid on the v4 (~2 MHz usable).
    centerfreq = 162.500; # MHz. Parks the window over the NOAA block. Kept a
                          # little off 162.400 so the channel avoids the DC
                          # spike that sits exactly at centerfreq.
    correction = 0;       # PPM trim. Leave 0; tune later only if needed.

    channels:
    (
      # ----- NOAA WXK76 — Step 1 smoke test (continuous 24/7 carrier) --------
      {
        freq = 162.400;                  # MHz — WXK76, Mt. Eldon (near Flagstaff)
        label = "NOAA WXK76 162.400";
        modulation = "nfm";
        bandwidth = 5000;                # Hz — NWS deviation is narrow
        ampfactor = 2.00;                # boost NFM audio level
        squelch_snr_threshold = 0.00;    # 0 = no squelch (always record);
                                         # ideal for a continuous-carrier test
        outputs:
        (
          {
            type = "file";
            directory = "/recordings";                 # -> ./recordings on host
            filename_template = "NOAA_162.400";
            # Output is MP3: NOAA_162.400_YYYYMMDD_HHMMSS.mp3
            # NOAA is a CONTINUOUS carrier, so this records to ONE file that
            # rotates at the top of each hour. A growing file == success.
            # (split_on_transmission only splits when squelch CLOSES, which a
            #  continuous carrier never does — see the gated channels below.)
          }
        );
      }

      # ----- Weak 162.400 here? The other NOAA freqs are in the same window. -
      # Parallel monitoring is free — uncomment any to find the strongest:
      # ,{ freq = 162.550; label = "NOAA 162.550"; modulation = "nfm";
      #    bandwidth = 5000; ampfactor = 2.00; squelch_snr_threshold = 0.00;
      #    outputs: ( { type = "file"; directory = "/recordings";
      #                 filename_template = "NOAA_162.550"; } ); }
      # ,{ freq = 162.475; label = "NOAA 162.475"; modulation = "nfm";
      #    bandwidth = 5000; ampfactor = 2.00; squelch_snr_threshold = 0.00;
      #    outputs: ( { type = "file"; directory = "/recordings";
      #                 filename_template = "NOAA_162.475"; } ); }
    );
  }

  # ===========================================================================
  # DEVICE 1  —  COMMENTED  —  Forestry / wildfire window  (THE incident band)
  # Add a SECOND dongle for this. 168–173 MHz are your priority "incident"
  # channels. NOTE: 168–173 is ~5 MHz wide — MORE than one dongle's ~2 MHz —
  # so pick a ~2 MHz sub-window with centerfreq (or use another dongle).
  #
  #  >>> VERIFY EVERY FREQ ON RADIOREFERENCE (Coconino County, AZ):
  #  >>> https://www.radioreference.com/db/browse/ctid/95
  #  >>> The seeds below are PLACEHOLDERS — do not trust them on-air.
  #
  # To enable: give it a 2nd dongle, then delete the leading "# " on each line.
  # ===========================================================================
  # ,{
  #    type = "rtlsdr";
  #    serial = "REPLACE_WITH_2ND_DONGLE_SERIAL";   # from rtl_test / rtl_eeprom -s
  #    gain = 32.0;
  #    sample_rate = 2.40;
  #    centerfreq = 170.500;        # parks ~169.5–171.5; set to your real freqs
  #    correction = 0;
  #    channels:
  #    (
  #      {
  #        freq = 170.000;          # <-- PLACEHOLDER. Verify USFS/AZ forestry net.
  #        label = "Forestry NET (VERIFY)";
  #        modulation = "nfm";
  #        bandwidth = 12500;       # public-safety/forestry NFM is ~12.5 kHz
  #        squelch_snr_threshold = 8.0;     # dB SNR over noise floor; tune 6–12
  #        outputs:
  #        (
  #          {
  #            type = "file";
  #            directory = "/recordings";
  #            filename_template = "FOREST_170.000";
  #            split_on_transmission = true;   # ONE .mp3 per transmission
  #            include_freq = true;            # append freq to filename
  #          }
  #        );
  #      }
  #      # ,{ freq = 171.xyz; label = "Coconino NF Tac (VERIFY)"; ... }
  #    );
  # }

  # ===========================================================================
  # DEVICE 2  —  COMMENTED  —  Sheriff / law (~155 MHz) window
  # Add a THIRD dongle. 155.490 & 155.835 are ~0.35 MHz apart, so they DO fit
  # together in one ~2 MHz window centered ~155.66.
  #  >>> VERIFY ON RADIOREFERENCE before trusting on-air.
  # ===========================================================================
  # ,{
  #    type = "rtlsdr";
  #    serial = "REPLACE_WITH_3RD_DONGLE_SERIAL";
  #    gain = 32.0;
  #    sample_rate = 2.40;
  #    centerfreq = 155.660;
  #    correction = 0;
  #    channels:
  #    (
  #      { freq = 155.490; label = "Coconino SO (VERIFY)"; modulation = "nfm";
  #        bandwidth = 12500; squelch_snr_threshold = 8.0;
  #        outputs: ( { type = "file"; directory = "/recordings";
  #          filename_template = "SHERIFF_155.490"; split_on_transmission = true;
  #          include_freq = true; } ); }
  #      ,{ freq = 155.835; label = "Coconino SO 2 (VERIFY)"; modulation = "nfm";
  #        bandwidth = 12500; squelch_snr_threshold = 8.0;
  #        outputs: ( { type = "file"; directory = "/recordings";
  #          filename_template = "SHERIFF_155.835"; split_on_transmission = true;
  #          include_freq = true; } ); }
  #    );
  # }

  # ===========================================================================
  # DEVICE 3  —  COMMENTED  —  GMRS / 70cm (~462 MHz) UHF window
  # Add a FOURTH dongle. GMRS repeater OUTPUTS are 462.550–462.725 (the 467.x
  # are repeater INPUTS, +5 MHz away = a separate window). Your GP-6 IS tuned
  # for 70cm, so UHF reception here should be good.
  #  >>> Fill in your local GMRS/ham repeaters and VERIFY.
  # ===========================================================================
  # ,{
  #    type = "rtlsdr";
  #    serial = "REPLACE_WITH_4TH_DONGLE_SERIAL";
  #    gain = 30.0;
  #    sample_rate = 2.40;
  #    centerfreq = 462.640;
  #    correction = 0;
  #    channels:
  #    (
  #      { freq = 462.550; label = "GMRS 550 (VERIFY)"; modulation = "nfm";
  #        bandwidth = 12500; squelch_snr_threshold = 8.0;
  #        outputs: ( { type = "file"; directory = "/recordings";
  #          filename_template = "GMRS_462.550"; split_on_transmission = true;
  #          include_freq = true; } ); }
  #    );
  # }
);
